<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Review photos</title>
    {% include '_head.html' %}
    <link rel="stylesheet" href="/static/vendor/font-awesome/css/font-awesome.min.css">
    <script src="/static/toast.js"></script>
    <script>
      const QUERY = {{ query | tojson }};
      const DONE_URL = {{ done_url | tojson }};
      // the queue decides every photo on a page; editing only saves what was changed
      const QUEUE = QUERY.status === 'unreviewed';
      const GAP = 6;
      // aim for about this many photos on screen, within sensible thumbnail sizes
      const TARGET_PHOTOS = {{ 28 if kiosk else 24 }};
      const MIN_THUMB = 110;
      const MAX_THUMB = 280;
      const DELETE_CONFIRM_MS = 4000;

      let offset = 0;
      let limit = 0;
      // tiles in the list, each of which can be a burst of photos
      let total = 0;
      let photos = 0;
      // the tiles on this page, followed by any burst photos they've been opened up to show
      let items = [];
      let latestLoad = 0;
      // photo id -> checked, for photos the user has changed; kept when moving between pages
      const changes = new Map();
      // photos on their way to being deleted, which the server may still be listing
      const deleting = new Set();
      let deleteError = '';
      let moveAfterDeletes = 0;
      let reloadAfterDeletes = false;
      // where a shift-click's range starts from
      let lastToggled = null;
      // whether the click about to change a checkbox had shift held
      let shiftClick = false;

      // unreviewed photos start out approved, except for ones unlikely to be wanted: the rest
      // of a burst, and anything that didn't come from a camera, like screenshots
      const startsChecked = item => QUEUE
        ? !item.inBurst && !item.no_camera
        : item.status !== 'rejected';
      const allPhotos = () => items.flatMap(item => [item, ...item.burst]);
      const tilesOnPage = () => items.filter(item => !item.inBurst).length;
      const isChecked = item => changes.has(item.id) ? changes.get(item.id) : startsChecked(item);
      const encodePath = path => path.split('/').map(encodeURIComponent).join('/');
      // how a photo has been set to be shown: turned, and brighter and more colorful
      const lookQuery = photo => {
        const look = new URLSearchParams();
        if (photo.rotation) {
          look.set('rotate', photo.rotation);
        }
        if (photo.enhanced) {
          look.set('enhance', 1);
        }
        const query = look.toString();
        return query ? `?${query}` : '';
      };
      const photoUrl = (api, item) => `/api/${api}${encodePath(item.path)}${lookQuery(item)}`;
      const pageUrl = (start, count) => '/api/review?' + new URLSearchParams({...QUERY, offset: start, limit: count});

      function fitPage() {
        const grid = document.getElementById('grid');
        const width = grid.clientWidth;
        const height = grid.clientHeight;
        const target = Math.min(MAX_THUMB, Math.max(MIN_THUMB, Math.sqrt(width * height / TARGET_PHOTOS)));
        const columns = Math.max(1, Math.floor((width + GAP) / (target + GAP)));
        const cell = (width - GAP * (columns - 1)) / columns;
        const rows = Math.max(1, Math.floor((height + GAP) / (cell + GAP)));
        grid.style.setProperty('--columns', columns);
        return columns * rows;
      }

      function showError(message) {
        document.getElementById('error').textContent = message;
      }

      function renderActions() {
        const decided = allPhotos();
        const checked = decided.filter(isChecked).length;
        const unchecked = decided.length - checked;
        const save = document.getElementById('save');
        if (QUEUE) {
          const parts = [];
          if (checked) parts.push(`Approve ${checked}`);
          if (unchecked) parts.push(`hide ${unchecked}`);
          const label = parts.join(', ');
          save.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          save.disabled = !items.length;
        } else {
          save.textContent = changes.size
            ? `Save ${changes.size} change${changes.size === 1 ? '' : 's'}`
            : 'No changes';
          save.disabled = !changes.size;
        }
        document.getElementById('toggle-all').textContent = items.some(isChecked) ? 'Uncheck all' : 'Check all';
        document.getElementById('previous').disabled = offset === 0;
        const tiles = tilesOnPage();
        document.getElementById('next').disabled = offset + tiles >= total;
        document.getElementById('summary').textContent = items.length
          ? `${QUEUE ? '' : 'Editing '}{{ scope }} · ${offset + 1}–${offset + tiles} of ${total.toLocaleString()}` +
            (photos > total ? ` (${photos.toLocaleString()} photos)` : '')
          : '{{ scope }}';
      }

      function setChecked(item, checked) {
        if (checked === startsChecked(item)) {
          changes.delete(item.id);
        } else {
          changes.set(item.id, checked);
        }
      }

      function renderItem(item) {
        const label = document.createElement('label');
        label.className = 'review-item';

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = isChecked(item);
        box.setAttribute('aria-label', item.path);
        box.onchange = () => {
          const start = shiftClick && lastToggled ? items.indexOf(lastToggled) : -1;
          const end = items.indexOf(item);
          const between = start < 0 ? [item] : items.slice(Math.min(start, end), Math.max(start, end) + 1);
          for (const other of between) {
            setChecked(other, box.checked);
            other.box.checked = box.checked;
          }
          shiftClick = false;
          lastToggled = item;
          renderActions();
        };
        item.box = box;

        const image = document.createElement('img');
        image.alt = '';
        image.src = photoUrl('thumb', item);
        image.onerror = () => {
          image.style.display = 'none';
          const message = document.createElement('span');
          message.className = 'no-preview';
          message.textContent = `No preview: ${item.path.split('/').pop()}`;
          // beneath the buttons, which have to stay usable
          label.insertBefore(message, check);
        };

        const check = document.createElement('span');
        check.className = 'check';
        check.textContent = '✓';

        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = item.date;

        const zoom = document.createElement('a');
        zoom.className = 'zoom';
        zoom.href = photoUrl('image', item);
        zoom.target = '_blank';
        zoom.rel = 'noopener';
        zoom.title = 'Open larger';
        zoom.textContent = '⤢';
        // a new tab can't be closed again on the kiosk
        zoom.onclick = event => {
          event.preventDefault();
          showLarge(zoom.href);
        };

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.title = 'Delete photo';
        remove.onclick = event => {
          event.preventDefault();
          deletePhoto(item, remove);
        };
        resetDeleteButton(remove);

        // the label's click comes first; the one it passes on to the checkbox doesn't say either way
        label.addEventListener('click', event => {
          if (event.target !== box) {
            shiftClick = event.shiftKey;
          }
        });
        label.append(box, image, check, date, zoom, remove);
        if (item.burst.length) {
          const more = document.createElement('button');
          more.type = 'button';
          more.className = 'more';
          more.title = 'Show the rest of this burst';
          more.textContent = `+${item.burst.length}`;
          more.onclick = event => {
            event.preventDefault();
            openBurst(item, label);
          };
          label.append(more);
        }
        if (item.no_camera && QUEUE) {
          const note = document.createElement('span');
          note.className = 'note';
          note.textContent = 'no camera data';
          label.append(note);
        }
        return label;
      }

      function openBurst(item, tile) {
        const others = item.burst;
        item.burst = [];
        items.splice(items.indexOf(item) + 1, 0, ...others);
        tile.replaceWith(renderItem(item), ...others.map(renderItem));
        renderActions();
      }

      // the next photo of a burst takes the place of the one being removed from it
      function promoteFromBurst(item) {
        const [next, ...rest] = item.burst;
        return Object.assign(next, {inBurst: item.inBurst, burst: rest});
      }

      function showLarge(url) {
        const large = document.getElementById('large');
        large.querySelector('img').src = url;
        large.hidden = false;
      }

      function closeLarge() {
        const large = document.getElementById('large');
        large.hidden = true;
        large.querySelector('img').removeAttribute('src');
      }

      function resetDeleteButton(button) {
        button.classList.remove('confirming');
        button.disabled = false;
        button.innerHTML = '<i class="fa fa-trash-o" aria-hidden="true"></i>';
      }

      // a second tap confirms, since it sits among tiles that are being tapped quickly
      async function deletePhoto(item, button) {
        if (!button.classList.contains('confirming')) {
          button.classList.add('confirming');
          button.textContent = 'Delete?';
          setTimeout(() => resetDeleteButton(button), DELETE_CONFIRM_MS);
          return;
        }
        showError('');
        // gone straight away, so that reviewing carries on while the NAS moves the file.  Its
        // slot stays empty, so that the other tiles don't move under a finger about to tap
        const tile = button.closest('.review-item');
        const change = changes.get(item.id);
        changes.delete(item.id);
        deleting.add(item.id);
        photos -= 1;
        if (item.burst.length) {
          const next = promoteFromBurst(item);
          items[items.indexOf(item)] = next;
          tile.replaceWith(renderItem(next));
        } else {
          items = items.filter(other => other !== item);
          if (!item.inBurst) {
            total -= 1;
          }
          tile.style.visibility = 'hidden';
        }
        renderActions();
        try {
          // keepalive so that it still completes if the page is left straight after
          const response = await fetch(`/api/image${encodePath(item.path)}`, {method: 'DELETE', keepalive: true});
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          const {files} = await response.json();
          showToast(`Deleted ${item.path.split('/').pop()}`, () => undoDelete(files));
        } catch (error) {
          if (change !== undefined) {
            changes.set(item.id, change);
          }
          reloadAfterDeletes = true;
          deleteError = `Couldn't delete ${item.path.split('/').pop()}: ${error.message}`;
        }
        deleting.delete(item.id);
        if (!deleting.size) {
          deletesSettled();
        }
      }

      async function undoDelete(files) {
        try {
          const response = await fetch('/api/restore', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({files})
          });
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          await load();
        } catch (error) {
          showError(`Couldn't undo: ${error.message}`);
        }
      }

      async function deletesSettled() {
        const error = deleteError;
        deleteError = '';
        if (moveAfterDeletes) {
          const direction = moveAfterDeletes;
          moveAfterDeletes = 0;
          await move(direction);
        } else if (!items.length || reloadAfterDeletes) {
          await load();
        }
        reloadAfterDeletes = false;
        if (error) {
          showError(error);
        }
      }

      // the first view of a thumbnail is slow while the NAS makes it, so make the next
      // page's ahead of time, once the current page is finished with the connection
      async function prepareNextPage(load, images) {
        await Promise.allSettled(images.map(image => image.decode()));
        if (load !== latestLoad || offset + tilesOnPage() >= total) {
          return;
        }
        const response = await fetch(pageUrl(offset + tilesOnPage(), limit));
        if (response.ok && load === latestLoad) {
          for (const item of (await response.json()).items) {
            new Image().src = photoUrl('thumb', item);
          }
        }
      }

      // a page can still list photos that are on their way to being deleted
      function takeOutDeleting(item) {
        item.burst.forEach(other => other.inBurst = true);
        item.burst = item.burst.filter(other => !deleting.has(other.id));
        if (!deleting.has(item.id)) {
          return item;
        }
        return item.burst.length ? promoteFromBurst(item) : null;
      }

      async function load() {
        const thisLoad = ++latestLoad;
        showError('');
        try {
          const response = await fetch(pageUrl(offset, limit));
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          const page = await response.json();
          if (thisLoad !== latestLoad) {
            return;
          }
          const listed = page.items.length;
          page.items = page.items.map(takeOutDeleting).filter(Boolean);
          page.total = Math.max(0, page.total - (listed - page.items.length));
          if (!page.total) {
            // otherwise this runs again once the deletes have finished
            if (!deleting.size) {
              window.location.href = DONE_URL;
            }
            return;
          }
          ({total, photos, offset, items} = page);
          lastToggled = null;
          const grid = document.getElementById('grid');
          grid.replaceChildren(...items.map(renderItem));
          grid.scrollTop = 0;
          renderActions();
          prepareNextPage(thisLoad, [...grid.querySelectorAll('img')]);
        } catch (error) {
          showError(`Couldn't load photos: ${error.message}`);
        }
      }

      async function save() {
        const button = document.getElementById('save');
        button.disabled = true;
        showError('');
        const decided = QUEUE ? allPhotos().map(item => [item.id, isChecked(item)]) : [...changes];
        const ids = checked => decided.filter(entry => entry[1] === checked).map(entry => entry[0]);
        try {
          const response = await fetch('/api/review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({approved: ids(true), rejected: ids(false)})
          });
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          decided.forEach(entry => changes.delete(entry[0]));
          if (QUEUE) {
            // saved photos leave the queue, so the next ones move up to this offset
            await load();
          } else {
            window.location.href = DONE_URL;
          }
        } catch (error) {
          showError(`Couldn't save: ${error.message}`);
          button.disabled = false;
        }
      }

      function toggleAll() {
        const check = !items.some(isChecked);
        items.forEach(item => setChecked(item, check));
        document.querySelectorAll('#grid input').forEach(box => box.checked = check);
        renderActions();
      }

      function move(direction) {
        // positions in the list only settle once deleted photos have left it
        if (deleting.size) {
          moveAfterDeletes = direction;
          return;
        }
        // a page may be short after deleting, and what followed it has moved up
        offset = Math.max(0, offset + (direction > 0 ? tilesOnPage() : -limit));
        return load();
      }

      window.addEventListener('beforeunload', event => {
        if (changes.size) {
          event.preventDefault();
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        limit = fitPage();
        load();
      });

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const fitted = fitPage();
          if (fitted !== limit) {
            limit = fitted;
            load();
          }
        }, 200);
      });
    </script>
  </head>
  <body class="review-page{% if kiosk %} kiosk-review{% endif %}">
    <div class="review-header">
      <a href="{{ done_url }}">‹ Back</a>
      <span id="summary">Loading…</span>
      <button id="toggle-all" onclick="toggleAll()">Uncheck all</button>
    </div>
    <div id="grid" class="review-grid"></div>
    <div id="error" class="review-error" role="alert"></div>
    <div class="review-footer">
      <button id="previous" onclick="move(-1)" disabled>‹ Previous</button>
      <button id="save" onclick="save()" disabled>Approve</button>
      <button id="next" onclick="move(1)" disabled>{{ 'Skip' if status == 'unreviewed' else 'Next' }} ›</button>
    </div>
    <div id="large" class="review-large" onclick="closeLarge()" hidden>
      <img alt="" />
      <span>Tap to close</span>
    </div>
  </body>
</html>
