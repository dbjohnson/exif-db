<!DOCTYPE html>
<html>
  <head>
    <title>Review photos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      const QUERY = {{ query | tojson }};
      const DONE_URL = {{ done_url | tojson }};
      // the queue decides every photo on a page; editing only saves what was changed
      const QUEUE = QUERY.status === 'unreviewed';
      const GAP = 6;
      // aim for about this many photos on screen, within sensible thumbnail sizes
      const TARGET_PHOTOS = {{ 28 if kiosk else 24 }};
      const MIN_THUMB = 110;
      const MAX_THUMB = 280;
      const DELETE_CONFIRM_MS = 4000;

      let offset = 0;
      let limit = 0;
      let total = 0;
      let items = [];
      let latestLoad = 0;
      // photo id -> checked, for photos the user has changed; kept when moving between pages
      const changes = new Map();
      // photos on their way to being deleted, which the server may still be listing
      const deleting = new Set();
      let deleteError = '';
      let moveAfterDeletes = 0;

      // unreviewed photos start out approved
      const startsChecked = item => item.status !== 'rejected';
      const isChecked = item => changes.has(item.id) ? changes.get(item.id) : startsChecked(item);
      const encodePath = path => path.split('/').map(encodeURIComponent).join('/');
      const photoUrl = (api, item) =>
        `/api/${api}${encodePath(item.path)}${item.rotation ? `?rotate=${item.rotation}` : ''}`;
      const pageUrl = (start, count) => '/api/review?' + new URLSearchParams({...QUERY, offset: start, limit: count});

      function fitPage() {
        const grid = document.getElementById('grid');
        const width = grid.clientWidth;
        const height = grid.clientHeight;
        const target = Math.min(MAX_THUMB, Math.max(MIN_THUMB, Math.sqrt(width * height / TARGET_PHOTOS)));
        const columns = Math.max(1, Math.floor((width + GAP) / (target + GAP)));
        const cell = (width - GAP * (columns - 1)) / columns;
        const rows = Math.max(1, Math.floor((height + GAP) / (cell + GAP)));
        grid.style.setProperty('--columns', columns);
        return columns * rows;
      }

      function showError(message) {
        document.getElementById('error').textContent = message;
      }

      function renderActions() {
        const checked = items.filter(isChecked).length;
        const unchecked = items.length - checked;
        const save = document.getElementById('save');
        if (QUEUE) {
          const parts = [];
          if (checked) parts.push(`Approve ${checked}`);
          if (unchecked) parts.push(`hide ${unchecked}`);
          const label = parts.join(', ');
          save.textContent = label.charAt(0).toUpperCase() + label.slice(1);
          save.disabled = !items.length;
        } else {
          save.textContent = changes.size
            ? `Save ${changes.size} change${changes.size === 1 ? '' : 's'}`
            : 'No changes';
          save.disabled = !changes.size;
        }
        document.getElementById('toggle-all').textContent = checked ? 'Uncheck all' : 'Check all';
        document.getElementById('previous').disabled = offset === 0;
        document.getElementById('next').disabled = offset + items.length >= total;
        document.getElementById('summary').textContent = items.length
          ? `${QUEUE ? '' : 'Editing '}{{ scope }} · ${offset + 1}–${offset + items.length} of ${total.toLocaleString()}`
          : '{{ scope }}';
      }

      function setChecked(item, checked) {
        if (checked === startsChecked(item)) {
          changes.delete(item.id);
        } else {
          changes.set(item.id, checked);
        }
      }

      function renderItem(item) {
        const label = document.createElement('label');
        label.className = 'review-item';

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = isChecked(item);
        box.setAttribute('aria-label', item.path);
        box.onchange = () => {
          setChecked(item, box.checked);
          renderActions();
        };

        const image = document.createElement('img');
        image.alt = '';
        image.src = photoUrl('thumb', item);
        image.onerror = () => {
          image.style.display = 'none';
          const message = document.createElement('span');
          message.className = 'no-preview';
          message.textContent = `No preview: ${item.path.split('/').pop()}`;
          // beneath the buttons, which have to stay usable
          label.insertBefore(message, check);
        };

        const check = document.createElement('span');
        check.className = 'check';
        check.textContent = '✓';

        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = item.date;

        const zoom = document.createElement('a');
        zoom.className = 'zoom';
        zoom.href = photoUrl('image', item);
        zoom.target = '_blank';
        zoom.rel = 'noopener';
        zoom.title = 'Open full size';
        zoom.textContent = '⤢';
        // a new tab can't be closed again on the kiosk
        zoom.onclick = event => {
          event.preventDefault();
          showLarge(zoom.href);
        };

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.title = 'Delete photo';
        remove.onclick = event => {
          event.preventDefault();
          deletePhoto(item, remove);
        };
        resetDeleteButton(remove);

        label.append(box, image, check, date, zoom, remove);
        return label;
      }

      function showLarge(url) {
        const large = document.getElementById('large');
        large.querySelector('img').src = url;
        large.hidden = false;
      }

      function closeLarge() {
        const large = document.getElementById('large');
        large.hidden = true;
        large.querySelector('img').removeAttribute('src');
      }

      function resetDeleteButton(button) {
        button.classList.remove('confirming');
        button.disabled = false;
        button.innerHTML = '<i class="fa fa-trash-o" aria-hidden="true"></i>';
      }

      // a second tap confirms, since it sits among tiles that are being tapped quickly
      async function deletePhoto(item, button) {
        if (!button.classList.contains('confirming')) {
          button.classList.add('confirming');
          button.textContent = 'Delete?';
          setTimeout(() => resetDeleteButton(button), DELETE_CONFIRM_MS);
          return;
        }
        showError('');
        // gone straight away, so that reviewing carries on while the NAS moves the file.  Its
        // slot stays empty, so that the other tiles don't move under a finger about to tap
        const tile = button.closest('.review-item');
        const change = changes.get(item.id);
        changes.delete(item.id);
        deleting.add(item.id);
        items = items.filter(other => other !== item);
        total -= 1;
        tile.style.visibility = 'hidden';
        renderActions();
        try {
          // keepalive so that it still completes if the page is left straight after
          const response = await fetch(`/api/image${encodePath(item.path)}`, {method: 'DELETE', keepalive: true});
          if (response.status === 409) {
            throw new Error("photos can't be deleted while a scan is running");
          }
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
        } catch (error) {
          if (change !== undefined) {
            changes.set(item.id, change);
          }
          items.push(item);
          total += 1;
          tile.querySelector('input').checked = isChecked(item);
          resetDeleteButton(button);
          tile.style.visibility = '';
          renderActions();
          deleteError = `Couldn't delete ${item.path.split('/').pop()}: ${error.message}`;
        }
        deleting.delete(item.id);
        if (!deleting.size) {
          deletesSettled();
        }
      }

      async function deletesSettled() {
        const error = deleteError;
        deleteError = '';
        if (moveAfterDeletes) {
          const direction = moveAfterDeletes;
          moveAfterDeletes = 0;
          await move(direction);
        } else if (!items.length) {
          await load();
        }
        if (error) {
          showError(error);
        }
      }

      // the first view of a thumbnail is slow while the NAS makes it, so make the next
      // page's ahead of time, once the current page is finished with the connection
      async function prepareNextPage(load, images) {
        await Promise.allSettled(images.map(image => image.decode()));
        if (load !== latestLoad || offset + items.length >= total) {
          return;
        }
        const response = await fetch(pageUrl(offset + items.length, limit));
        if (response.ok && load === latestLoad) {
          for (const item of (await response.json()).items) {
            new Image().src = photoUrl('thumb', item);
          }
        }
      }

      async function load() {
        const thisLoad = ++latestLoad;
        showError('');
        try {
          const response = await fetch(pageUrl(offset, limit));
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          const page = await response.json();
          if (thisLoad !== latestLoad) {
            return;
          }
          page.items = page.items.filter(item => !deleting.has(item.id));
          page.total = Math.max(0, page.total - deleting.size);
          if (!page.total) {
            // otherwise this runs again once the deletes have finished
            if (!deleting.size) {
              window.location.href = DONE_URL;
            }
            return;
          }
          ({total, offset, items} = page);
          const grid = document.getElementById('grid');
          grid.replaceChildren(...items.map(renderItem));
          grid.scrollTop = 0;
          renderActions();
          prepareNextPage(thisLoad, [...grid.querySelectorAll('img')]);
        } catch (error) {
          showError(`Couldn't load photos: ${error.message}`);
        }
      }

      async function save() {
        const button = document.getElementById('save');
        button.disabled = true;
        showError('');
        const decided = QUEUE ? items.map(item => [item.id, isChecked(item)]) : [...changes];
        const ids = checked => decided.filter(entry => entry[1] === checked).map(entry => entry[0]);
        try {
          const response = await fetch('/api/review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({approved: ids(true), rejected: ids(false)})
          });
          if (!response.ok) {
            throw new Error('Status: ' + response.status);
          }
          decided.forEach(entry => changes.delete(entry[0]));
          if (QUEUE) {
            // saved photos leave the queue, so the next ones move up to this offset
            await load();
          } else {
            window.location.href = DONE_URL;
          }
        } catch (error) {
          showError(`Couldn't save: ${error.message}`);
          button.disabled = false;
        }
      }

      function toggleAll() {
        const check = !items.some(isChecked);
        items.forEach(item => setChecked(item, check));
        document.querySelectorAll('#grid input').forEach(box => box.checked = check);
        renderActions();
      }

      function move(direction) {
        // positions in the list only settle once deleted photos have left it
        if (deleting.size) {
          moveAfterDeletes = direction;
          return;
        }
        // a page may be short after deleting, and what followed it has moved up
        offset = Math.max(0, offset + (direction > 0 ? items.length : -limit));
        return load();
      }

      window.addEventListener('beforeunload', event => {
        if (changes.size) {
          event.preventDefault();
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        limit = fitPage();
        load();
      });

      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const fitted = fitPage();
          if (fitted !== limit) {
            limit = fitted;
            load();
          }
        }, 200);
      });
    </script>
  </head>
  <body class="review-page{% if kiosk %} kiosk-review{% endif %}">
    <div class="review-header">
      <a href="{{ done_url }}">‹ Back</a>
      <span id="summary">Loading…</span>
      <button id="toggle-all" onclick="toggleAll()">Uncheck all</button>
    </div>
    <div id="grid" class="review-grid"></div>
    <div id="error" class="review-error" role="alert"></div>
    <div class="review-footer">
      <button id="previous" onclick="move(-1)" disabled>‹ Previous</button>
      <button id="save" onclick="save()" disabled>Approve</button>
      <button id="next" onclick="move(1)" disabled>{{ 'Skip' if status == 'unreviewed' else 'Next' }} ›</button>
    </div>
    <div id="large" class="review-large" onclick="closeLarge()" hidden>
      <img alt="" />
      <span>Tap to close</span>
    </div>
  </body>
</html>
