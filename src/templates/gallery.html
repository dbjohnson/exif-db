<html>
  <head>
    <title>Exif DB</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      function downloadImage(href) {
          var downloadLink = document.createElement('a');
          downloadLink.href = href;
          downloadLink.download = href.split('/').pop();
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
      }

      function deleteImage(href, button) {
        if (confirm('Are you sure you want to delete this image?')) {
          fetch(href, {
            method: 'DELETE'
          })
          .then(response=>{
            if (response.status === 409) {
              throw new Error("Can't delete images while a scan is running");
            }
            if (!response.ok) {
              throw new Error('Network response was not ok. Status: ' + response.status);
            }
            return response.json()
          })
          .then(data => {
            console.log('Success:', data);
            button.closest('.image-container').remove();
          })
          .catch((error) => {
            console.log(error)
            alert(error);
          })
        }
      }

      function goToDate() {
        const [year, month, day] = document.getElementById('date-picker').value.split('-').map(Number);
        // ignore partly typed years
        if (!year || year < 1000) {
          return;
        }
        const params = new URLSearchParams({
          year,
          month,
          day,
          all_years: document.getElementById('all-years').checked
        });
        const n = new URLSearchParams(window.location.search).get('n');
        if (n) {
          params.set('n', n);
        }
        window.location.href = '/onthisday?' + params;
      }

      // wait for a pause, so typing a date doesn't navigate after every digit
      let datePickerTimeout;
      function datePicked() {
        clearTimeout(datePickerTimeout);
        datePickerTimeout = setTimeout(goToDate, 700);
      }
    </script>
  </head>
  <body style="background-color:#000">
    <div
      style="display:flex;justify-content:center;align-items:center;gap:5px;margin:10px;"
    >
      <button
        onclick="window.location.href='/random'"
        style="border:2px solid #ddd;"
      >
        Random photos
      </button>
      <button
        onclick="window.location.href='/onthisday'"
        style="border:2px solid #ddd;"
      >
        Photos from this date
      </button>
      <button
        onclick="window.location.href='/manage'"
        style="border:2px solid #ddd;"
      >
        Manage
      </button>
    </div>
    <div class="date-controls">
      <input
        id="date-picker"
        type="date"
        aria-label="Show photos from date"
        value="{{ picked_date or '' }}"
        onchange="datePicked()"
      />
      <label class="toggle">
        <input
          id="all-years"
          type="checkbox"
          role="switch"
          {% if all_years %}checked{% endif %}
          onchange="goToDate()"
        />
        <span>include all years</span>
      </label>
    </div>
    {% if not images %}
    <div class="no-images">No photos from this date</div>
    {% endif %}
    {% for im in images %}
    <div class="image-container">
      <img
        src="/api/image{{ im['SourceFile'] }}"
        alt="{{ im['SourceFile'] }}"
      />
      <div class="badge">
        <span>{{ im['date'] }}</span>
        <span>{{ im['title'] }}</span>
        <button
          onclick="downloadImage('/api/image{{ im['SourceFile'] }}')"
          title="Download original"
        >
          <i class="fa fa-arrow-circle-o-down" aria-hidden="true"></i>
        </button>
        <button
          onclick="deleteImage('/api/image{{ im['SourceFile'] }}', this)"
          title="Permanent delete"
        >
          <i class="fa fa-trash-o" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    {% endfor %}
  </body>
</html>
