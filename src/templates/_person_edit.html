<div id="person-edit" class="person-edit" hidden>
  <label>
    Name
    <input id="person-new-name" type="text" list="names" maxlength="80" value="{{ person }}" aria-label="New name for {{ person }}" onkeydown="if (event.key === 'Enter') renamePerson({{ person | tojson | forceescape }});" />
  </label>
  <button onclick="renamePerson({{ person | tojson | forceescape }})">Rename</button>
  <button type="button" class="person-family" aria-pressed="{{ 'true' if is_family(person) else 'false' }}" onclick="toggleFamily(this, {{ person | tojson | forceescape }})">Family</button>
  <button class="person-remove" onclick="removePerson(this, {{ person | tojson | forceescape }})">Remove person</button>
  <p class="library-hint">Using a name someone already has joins the two together. Removing sends these faces back to "Who is this?" and leaves the photos alone. Family shows them on People when it's showing only family.</p>
</div>
