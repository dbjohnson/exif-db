
<html>
  <head>
    <title>Exif DB</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/kiosk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      let currentIndex = 0;
      let timeoutId = undefined;
      let images = {{ images | tojson }};
      // the image on screen, which lags currentIndex while the next one loads
      let shown = undefined;

      const imageUrl = path => `/api/image${path.split('/').map(encodeURIComponent).join('/')}`;

      function deleteImage(button) {
        // protect against race condition if image refreshes while waiting
        // for user confirmation
        const deleteIndex = currentIndex;
        const path = images[deleteIndex].SourceFile;
        if (confirm('Are you sure you want to delete this image?')) {
          fetch(
            imageUrl(path), {
            method: 'DELETE'
          })
          .then(response=>{
            if (response.status === 409) {
              throw new Error("Can't delete images while a scan is running");
            }
            if (!response.ok) {
              throw new Error('Network response was not ok. Status: ' + response.status);
            }
            return response.json()
          })
          .then(data => {
             // remove image from list
             images.splice(deleteIndex, 1);
             // get a new one
             refreshImage();
          })
          .catch((error) => {
            console.log(error)
            alert(error);
          })
        }
      }

      function renderFavorite() {
        const button = document.getElementById('favorite');
        button.setAttribute('aria-pressed', shown.favorite);
        button.querySelector('i').className = `fa ${shown.favorite ? 'fa-heart' : 'fa-heart-o'} fa-2x`;
      }

      function toggleFavorite() {
        const image = shown;
        if (!image) {
          return;
        }
        const favorite = !image.favorite;
        fetch('/api/favorite', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({photo_id: image.photo_id, favorite})
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok. Status: ' + response.status);
          }
          image.favorite = favorite;
          if (image === shown) {
            renderFavorite();
          }
        })
        .catch((error) => {
          console.log(error)
          alert(error);
        })
      }

      function refreshImage() {
        if (!images.length) {
          window.location.reload();
          return;
        }
        currentIndex += 1;
        currentIndex = currentIndex % images.length;
        let image = images[currentIndex];
        const tempImg = new Image();
        tempImg.src = imageUrl(image.SourceFile);
        // When it loads, swap it in
        tempImg.onload = () => {
          // fade transition
          let im = document.getElementById("img");
          im.classList.add("hidden");
          // fade back in after transition time
          setTimeout(() => {
            im.src = tempImg.src;
            im.classList.remove("hidden");
            document.getElementById("date").textContent = image.date;
            shown = image;
            renderFavorite();
          }, 200)
        };

        // cancel existing timeout in case the user pressed fast forward
        if (timeoutId !== undefined) {
          clearTimeout(timeoutId);
        }
        // reload after defined interval
        timeoutId = setTimeout(refreshImage, {{ refresh_secs * 1000 }});
      }

      // Load the image once on page load
      if (images.length) {
        refreshImage();
      } else {
        // pick up photos approved from elsewhere
        setTimeout(() => window.location.reload(), {{ refresh_secs * 1000 }});
      }
    </script>
  </head>
  <body style="background-color:#000">
    {% if not images %}
    {% if background %}
    <img class="day-background" src="/api/image{{ background | urlencode }}" alt="" />
    {% endif %}
    <div class="no-images">
      <p>No approved photos around today</p>
      <a href="{{ review_url }}">Review today's photos</a>
    </div>
    {% else %}
    <div class="image-container">
      <img
        id="img"
      style="height:100%;width:100%"
      />
      <div class="badge">
        <span id="date"></span>
        <span></span>
        <button
          id="favorite"
          class="favorite-toggle"
          aria-pressed="false"
          onclick="toggleFavorite()"
          title="Favorite"
        >
          <i class="fa fa-heart-o fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="deleteImage(this)"
          title="Permanent delete"
        >
          <i class="fa fa-trash-o fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="refreshImage()"
          title="Next image"
        >
          <i class="fa fa-fast-forward fa-2x" aria-hidden="true"></i>
        </button>        
      </div>
    </div>
    {% endif %}
  </body>
</html>
