
<html>
  <head>
    <title>Exif DB</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="favicon" rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/kiosk.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      let currentIndex = 0;
      let timeoutId = undefined;
      let images = {{ images | tojson }};
      // the image on screen, which lags currentIndex while the next one loads
      let shown = undefined;
      let paused = false;
      let latestLoad = 0;
      let failedLoads = 0;
      // how many upcoming photos to keep ready, so that skipping to them is immediate
      const PRELOAD_COUNT = 3;
      // image -> {element, ready, settled}, for photos fetched before they're shown
      const preloads = new Map();

      const imageUrl = (path, rotation) =>
        `/api/image${path.split('/').map(encodeURIComponent).join('/')}${rotation ? `?rotate=${rotation}` : ''}`;

      function deleteImage(button) {
        // protect against race condition if image refreshes while waiting
        // for user confirmation
        const deleteIndex = currentIndex;
        const path = images[deleteIndex].SourceFile;
        if (confirm('Are you sure you want to delete this image?')) {
          fetch(
            imageUrl(path), {
            method: 'DELETE'
          })
          .then(response=>{
            if (response.status === 409) {
              throw new Error("Can't delete images while a scan is running");
            }
            if (!response.ok) {
              throw new Error('Network response was not ok. Status: ' + response.status);
            }
            return response.json()
          })
          .then(data => {
             // remove image from list
             images.splice(deleteIndex, 1);
             // get a new one
             refreshImage();
          })
          .catch((error) => {
            console.log(error)
            alert(error);
          })
        }
      }

      // keeps a run of quick presses saving in order
      let savingRotation = Promise.resolve();

      function showRotation(image) {
        const rotation = image.rotation;
        const url = imageUrl(image.SourceFile, rotation);
        // keep the current one up until the rotated copy has been made
        const element = new Image();
        element.onload = () => {
          if (image === shown && image.rotation === rotation) {
            document.getElementById('img').src = url;
          }
        };
        element.src = url;
      }

      function rotateImage() {
        const image = shown;
        if (!image) {
          return;
        }
        const rotation = (image.rotation + 90) % 360;
        image.rotation = rotation;
        // anything already fetched for it is now the wrong way round
        preloads.delete(image);
        showRotation(image);
        savingRotation = savingRotation.then(() => fetch('/api/rotate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({photo_id: image.photo_id, rotation})
        })).then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok. Status: ' + response.status);
          }
        }).catch((error) => {
          console.log(error)
          image.rotation = (image.rotation + 270) % 360;
          showRotation(image);
          alert(error);
        });
        // a full interval to see the result before the slideshow moves on
        scheduleNext();
      }

      function hideImage() {
        const image = shown;
        if (!image) {
          return;
        }
        fetch('/api/review', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({rejected: [image.photo_id]})
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok. Status: ' + response.status);
          }
          const index = images.indexOf(image);
          if (index < 0) {
            return;
          }
          images.splice(index, 1);
          // keep the images after it from being skipped
          if (index <= currentIndex) {
            currentIndex -= 1;
          }
          refreshImage();
        })
        .catch((error) => {
          console.log(error)
          alert(error);
        })
      }

      function renderFavorite() {
        const button = document.getElementById('favorite');
        button.setAttribute('aria-pressed', shown.favorite);
        button.querySelector('i').className = `fa ${shown.favorite ? 'fa-heart' : 'fa-heart-o'} fa-2x`;
      }

      function toggleFavorite() {
        const image = shown;
        if (!image) {
          return;
        }
        const favorite = !image.favorite;
        fetch('/api/favorite', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({photo_id: image.photo_id, favorite})
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok. Status: ' + response.status);
          }
          image.favorite = favorite;
          if (image === shown) {
            renderFavorite();
          }
        })
        .catch((error) => {
          console.log(error)
          alert(error);
        })
      }

      function scheduleNext() {
        // cancel existing timeout in case the user pressed fast forward
        if (timeoutId !== undefined) {
          clearTimeout(timeoutId);
          timeoutId = undefined;
        }
        // reload after defined interval
        if (!paused) {
          timeoutId = setTimeout(refreshImage, {{ refresh_secs * 1000 }});
        }
      }

      function togglePause() {
        paused = !paused;
        const button = document.getElementById('pause');
        button.title = paused ? 'Resume slideshow' : 'Pause slideshow';
        button.querySelector('i').className = `fa ${paused ? 'fa-play' : 'fa-pause'} fa-2x`;
        // a slow image already on its way would replace the one being paused on
        const index = images.indexOf(shown);
        if (paused && index >= 0) {
          latestLoad += 1;
          currentIndex = index;
          keepPreloaded();
        }
        scheduleNext();
      }

      function preload(image) {
        let entry = preloads.get(image);
        if (!entry) {
          // only fetched, not decoded: decoded photos would use the graphics memory that
          // the Pi running the frame is already short of
          const element = new Image();
          entry = {element, settled: false, failed: false};
          entry.ready = new Promise((resolve, reject) => {
            element.onload = resolve;
            element.onerror = reject;
          });
          element.src = imageUrl(image.SourceFile, image.rotation);
          preloads.set(image, entry);
          entry.ready.then(() => {
            entry.settled = true;
            keepPreloaded();
          }, () => {
            entry.settled = true;
            entry.failed = true;
            keepPreloaded();
          });
        }
        return entry;
      }

      function keepPreloaded() {
        const upcoming = [];
        for (let i = 1; i <= Math.min(PRELOAD_COUNT, images.length - 1); i++) {
          upcoming.push(images[(currentIndex + i) % images.length]);
        }
        preloads.forEach((entry, image) => {
          if (image !== images[currentIndex] && !upcoming.includes(image)) {
            preloads.delete(image);
            entry.element.src = '';
          }
        });
        // one at a time, since the NAS holds up other requests while it converts a photo
        if ([...preloads.values()].every(entry => entry.settled)) {
          const next = upcoming.find(image => !preloads.has(image));
          if (next) {
            preload(next);
          }
        }
      }

      function refreshImage() {
        if (!images.length) {
          window.location.reload();
          return;
        }
        currentIndex += 1;
        currentIndex = currentIndex % images.length;
        let image = images[currentIndex];
        const thisLoad = ++latestLoad;
        const url = imageUrl(image.SourceFile, image.rotation);
        // an earlier failure may just have been the NAS being unreachable
        if (preloads.get(image)?.failed) {
          preloads.delete(image);
        }
        // When it's ready, swap it in
        preload(image).ready.then(() => {
          if (thisLoad !== latestLoad) {
            return;
          }
          failedLoads = 0;
          // fade transition
          let im = document.getElementById("img");
          im.classList.add("hidden");
          // fade back in after transition time
          setTimeout(() => {
            if (thisLoad !== latestLoad) {
              im.classList.remove("hidden");
              return;
            }
            im.src = url;
            im.classList.remove("hidden");
            document.getElementById("date").textContent = image.date;
            shown = image;
            renderFavorite();
          }, 200)
        }, () => {
          // try it again next time around
          preloads.delete(image);
          if (thisLoad !== latestLoad) {
            return;
          }
          // move past a missing photo, but don't spin if the NAS is unreachable
          failedLoads += 1;
          if (failedLoads < images.length) {
            refreshImage();
          }
        });
        keepPreloaded();

        scheduleNext();
      }

      // Load the image once on page load
      if (images.length) {
        refreshImage();
      } else {
        // pick up photos approved from elsewhere
        setTimeout(() => window.location.reload(), {{ refresh_secs * 1000 }});
      }
    </script>
  </head>
  <body style="background-color:#000">
    {% if not images %}
    {% if background %}
    <img class="day-background" src="{{ background }}" alt="" />
    {% endif %}
    <div class="no-images">
      <p>No approved photos around today</p>
      <a href="{{ review_url }}">Review today's photos</a>
    </div>
    {% else %}
    <div class="image-container">
      <img
        id="img"
      style="height:100%;width:100%"
      />
      <div class="badge">
        <span id="date"></span>
        <span></span>
        <button
          id="favorite"
          class="favorite-toggle"
          aria-pressed="false"
          onclick="toggleFavorite()"
          title="Favorite"
        >
          <i class="fa fa-heart-o fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="rotateImage()"
          title="Rotate 90° clockwise"
        >
          <i class="fa fa-rotate-right fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="hideImage()"
          title="Hide (remove approval)"
        >
          <i class="fa fa-eye-slash fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="deleteImage(this)"
          title="Permanent delete"
        >
          <i class="fa fa-trash-o fa-2x" aria-hidden="true"></i>
        </button>
        <button
          id="pause"
          onclick="togglePause()"
          title="Pause slideshow"
        >
          <i class="fa fa-pause fa-2x" aria-hidden="true"></i>
        </button>
        <button
          onclick="refreshImage()"
          title="Next image"
        >
          <i class="fa fa-fast-forward fa-2x" aria-hidden="true"></i>
        </button>        
      </div>
    </div>
    {% endif %}
  </body>
</html>
